name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Import every connector module
        # A packaging mistake here (a relative import reaching outside the package,
        # a module that moved) otherwise only shows up when someone imports it.
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import apex_soc
          failed = []
          for mod in pkgutil.walk_packages(apex_soc.__path__, apex_soc.__name__ + "."):
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:
                  failed.append(f"{mod.name}: {type(exc).__name__}: {exc}")
          for f in failed:
              print("FAIL", f)
          print(f"imported {len(list(pkgutil.walk_packages(apex_soc.__path__, apex_soc.__name__ + '.')))} modules, {len(failed)} failed")
          sys.exit(1 if failed else 0)
          PY
      - name: pytest
        run: pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff check
        run: ruff check src tests --output-format concise || true
      - name: Verify no import escapes the package
        # The extraction is only clean if nothing reaches back into a host project.
        run: |
          if grep -rn 'dcc\.' src/ --include='*.py'; then
            echo "::error::found a reference to the host project (dcc.) -- extraction is incomplete"
            exit 1
          fi
          echo "no host-project references"
